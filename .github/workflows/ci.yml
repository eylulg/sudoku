name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sudoku
    steps:
      # The app depends on file:../ui, so the library is checked out next to it.
      - uses: actions/checkout@v4
        with:
          path: sudoku
      - uses: actions/checkout@v4
        with:
          repository: eylulg/ui
          path: ui
      - uses: actions/setup-node@v4
        with:
          node-version-file: sudoku/.nvmrc
      - name: Build ui
        working-directory: ui
        run: |
          npm ci
          npm run build
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run ci:lint
      - name: Format
        run: npm run format:check
      - name: Unused code
        run: npm run knip
      - name: Test
        run: npm test
      - name: Build
        run: npm run build-only

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
