name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sudoku
    steps:
      - uses: actions/checkout@v4
        with:
          path: sudoku
      - uses: actions/checkout@v4
        with:
          repository: eylulg/ui
          path: ui
      - uses: actions/setup-node@v4
        with:
          node-version-file: sudoku/.nvmrc
      - name: Build ui
        working-directory: ui
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run build
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sudoku/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
